version: '3.9'

services:
  # ── Backend principal ────────────────────────────────
  backend:
    build:
      context: ../mision-4-auth   # usa el código de la misión 4
      dockerfile: ../mision-5-docker/Dockerfile
    container_name: mision-backend
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET:-super-secreto-cambiar-en-produccion}
    restart: unless-stopped   # reinicia si el proceso muere
    networks:
      - app-network
    # En producción agregarías:
    # depends_on:
